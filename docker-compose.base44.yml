services:
  web:
    image: oven/bun:1.2
    working_dir: /app
    restart: on-failure
    volumes:
      # Bind-mount the cloned source so edits are reflected live
      - ./:/app
      # Persist installed deps across restarts without polluting the repo
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      # Vite >= 6.1 appends this to allowedHosts so the preview proxy host is accepted
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${BASE44_PUBLIC_HOST_SUFFIX}
    command:
      - sh
      - -ec
      - |
        bun install
        exec bun dev --host 0.0.0.0 --port 3000
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  node_modules:
